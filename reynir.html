<!doctype html>
<html lang="is">
  <!-- Reynir bakarí's OWN shell — the standalone build's index.html.

       This file exists because the catalogue's index.html is the wrong shell
       for a client's production site in every way that has bitten us:
       lang="en" on an Icelandic page, thirty font families when this site
       uses two, the catalogue's icons, the catalogue's title. Instead of
       stripping all of that back out in postprocessing (the old approach,
       one regex per symptom), the standalone build starts from a shell that
       was never wrong. reynir-seo.mjs still injects per-route meta/JSON-LD
       on top at build time. -->
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Reynir bakarí</title>
    <meta name="theme-color" content="#131313" />
    <!-- Only the two families this site actually uses. The catalogue shell
         loads ~30 for its hundred designs; shipping that to the bakery's
         customers would be pure waste. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Lusitana:wght@400;700&family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,500;0,8..60,600;1,8..60,400&display=swap"
      rel="stylesheet"
    />
    <link rel="icon" href="/reynir/brand/favicon-32.png" type="image/png" sizes="32x32" />
    <link rel="icon" href="/reynir/brand/favicon-48.png" type="image/png" sizes="48x48" />
    <link rel="apple-touch-icon" href="/reynir/brand/apple-touch-icon.png" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/reynir-main.tsx"></script>
  </body>
</html>
