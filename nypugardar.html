<!doctype html>
<html lang="en">
  <!-- Nýpugarðar's OWN shell: the standalone build's index.html.

       The catalogue's index.html is the wrong shell for a client's production
       site in every way that has bitten us: the catalogue's title, its icons,
       thirty font families when this site uses two, and a blanket noindex.
       Instead of stripping that back out afterwards, the standalone build
       starts from a shell that was never wrong. tools/nypugardar-seo.mjs
       injects each route's own lang, title, description, canonical, hreflang
       pair, Open Graph card and structured data on top at build time. -->
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Nýpugarðar</title>
    <meta name="theme-color" content="#15130F" />
    <!-- Safari 26 ignores theme-color; body background-color is its fallback
         tint source, and this static rule also kills the white flash before
         the bundle's CSS arrives. -->
    <style>html, body { background-color: #15130F; }</style>
    <!-- The hero intro hold (preview/nypugardar/Hero.tsx). The prerendered
         wordmark would otherwise paint at rest, then drop and rise again when
         the bundle hydrates. This marks the document BEFORE first paint so the
         stylesheet in the hero holds the letters down until React plays the
         arrival. No script, no hold: crawlers and failed bundles see the
         resting page. The 3.5 s failsafe releases it if hydration never
         comes, and tells Hero.tsx not to replay it late. Reduced motion and
         deep links (#hash) never hold. -->
    <script>try{var d=document.documentElement;if(!matchMedia('(prefers-reduced-motion: reduce)').matches&&!location.hash){history.scrollRestoration='manual';d.dataset.nypIntro='held';setTimeout(function(){if(d.dataset.nypIntro==='held')d.dataset.nypIntro='released'},3500)}}catch(e){}</script>
    <!-- The hero arrival, started early. The hold above used to wait for React to
         hydrate, and on a phone that sits behind a 173 KB lazy chunk: the wordmark
         and the tagline stayed hidden until the 3.5 s failsafe let go. Everything the
         arrival needs is already in the prerendered page, so it starts as soon as the
         hero is parsed, the stylesheet is in, the photograph is decoded and the two
         Erode faces are loaded (or at 3 s, so a slow photo never keeps the name
         hidden). It only flips data-nyp-intro held -> playing, after two painted
         frames so the held state has been drawn once; the transitions themselves
         are CSS in Hero.tsx, with the same easing, durations and delays as the React
         path, which stays as the fallback and leaves a running arrival alone.
         Past 1.7 s the whole arrival (tagline fully up about 1.9 s after it starts)
         would land later than the 3.5 s failsafe, so it is skipped and the page is
         simply released, as the failsafe does, only sooner. -->
    <script>try{(function(){var d=document.documentElement;if(d.dataset.nypIntro!=='held')return;var on=false,seen=false,mo;function go(){if(on)return;on=true;if(mo)mo.disconnect();requestAnimationFrame(function(){requestAnimationFrame(function(){if(d.dataset.nypIntro!=='held')return;if(performance.now()>1700){d.dataset.nypIntro='released';return}d.dataset.nypIntro='playing';setTimeout(function(){if(d.dataset.nypIntro==='playing')d.dataset.nypIntro='released'},2800)})})}function ready(){var l=document.querySelector('link[rel=stylesheet]');if(l&&!l.sheet){l.addEventListener('load',ready,{once:true});return}var i=document.querySelector('.nyp-hero-photo'),w=[];if(i&&i.decode)w.push(i.decode());if(document.fonts&&document.fonts.load)w.push(document.fonts.load('300 1em Erode'),document.fonts.load('italic 300 1em Erode'));Promise.all(w.map(function(p){return p.catch(function(){})})).then(go)}function look(){if(seen||!document.querySelector('.nyp-fog--near'))return;seen=true;if(mo)mo.disconnect();ready()}look();if(!seen){mo=new MutationObserver(look);mo.observe(d,{childList:true,subtree:true})}setTimeout(go,Math.max(0,3000-performance.now()))})()}catch(e){}</script>
    <!-- focus-guard (_tools/focus-guard): a focus ring only for people using a keyboard.
         Safari and every touch tap never focus a pressed button, so a dialog that moves
         focus into itself (the photo zoom on /rooms/) painted a ring on its close button
         on the first tap. This remembers the last input kind on <html data-input>; the
         CSS at the end of nypugardar.css drops the ring while it is a pointer. -->
    <script>(function(){var r=document.documentElement;function s(v){if(r.getAttribute("data-input")!==v)r.setAttribute("data-input",v)}addEventListener("pointerdown",function(){s("pointer")},true);addEventListener("keydown",function(e){if(e.key==="Shift"||e.key==="Control"||e.key==="Alt"||e.key==="Meta")return;s("key")},true)})();</script>
    <link rel="icon" href="/nypugardar/brand/favicon-32.png" type="image/png" sizes="32x32" />
    <link rel="icon" href="/nypugardar/brand/favicon-48.png" type="image/png" sizes="48x48" />
    <link rel="apple-touch-icon" href="/nypugardar/brand/apple-touch-icon.png" />
    <!-- The hero photograph is the largest contentful paint on every visit;
         asking for it before the bundle has parsed shaves the whole script
         round-trip off it. Same file the page picks at desktop widths. -->
    <link rel="preload" as="image" href="/nypugardar/photos/125645004-2000.jpg" imagesrcset="/nypugardar/photos/125645004-640.jpg 640w, /nypugardar/photos/125645004-1280.jpg 1280w, /nypugardar/photos/125645004-2000.jpg 2000w, /nypugardar/photos/125645004-2600.jpg 2600w" imagesizes="100vw" fetchpriority="high" />
    <!-- Cloudflare Web Analytics: cookieless, stores nothing that identifies a
         visitor, so no consent banner is required. The token is injected at
         build time from VITE_NYPUGARDAR_CF_ANALYTICS_TOKEN; with no token the
         tag is stripped by tools/nypugardar-standalone-post.mjs and the site
         ships clean. Get the token at Cloudflare dashboard → Web Analytics →
         the site → JS snippet. -->
    <script defer src="https://static.cloudflareinsights.com/beacon.min.js" data-cf-beacon='{"token":"__CF_ANALYTICS_TOKEN__"}'></script>

    <!-- SNDR Pulse: the owner's monthly report counts what happens here.
         Same tag as the other live sites; the worker knows the id. -->
    <script defer src="https://sndr-pulse.sindri-381.workers.dev/p.js" data-site="nypugardar"></script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/nypugardar-main.tsx"></script>
  </body>
</html>
