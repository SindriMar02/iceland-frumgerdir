<!doctype html><html lang="is"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="format-detection" content="telephone=no"><meta name="bg-route" content="/thjonusta/smurstoed/"><meta name="robots" content="noindex,nofollow"><meta name="theme-color" content="#0F0D0B"><meta name="description" content="Þú finnur Mobil smurstöð Bílageirans í Grófinni 14a. Hringdu beint í 436 6901 eða sendu okkur fyrirspurn um smurningu."><title>Smurstöð í Reykjanesbæ | Bílageirinn</title><link rel="icon" type="image/png" sizes="32x32" href="/favicons/favicon-32.png"><link rel="apple-touch-icon" href="/favicons/apple-touch-icon.png"><style>html,body{margin:0;background:#0F0D0B}button,input,textarea,select{font:inherit}html[data-input="pointer"] :focus-visible:not(input):not(textarea):not(select):not([contenteditable="true"]){outline:none!important}[tabindex="-1"]:focus{outline:none!important}</style><script>/* focus-guard: a focus ring only for people using a keyboard.

   The bug it ends: a menu, drawer or dialog opens and its FIRST link (or the dialog's close button)
   is outlined, as if it were selected. Cause: opening code calls first.focus(), or <dialog>.showModal()
   focuses the first control by itself. When nothing was focused before, the browser decides the ring is
   wanted. Safari never focuses a button on click and a touch tap never does either, so on iPhone,
   iPad and Safari the very first tap paints the ring. Chrome with a mouse hides it, which is why it
   passes the desktop check and then reappears on Sindri's phone.

   How: remember the last input kind on <html data-input="pointer|key"> and let focus-guard.css drop the
   ring while the last input was a pointer. Keyboard users keep every ring. Load before everything else
   (inline in <head>, ~400 bytes), no dependencies. Doc: _tools/focus-guard/README.md */
(function () {
  var root = document.documentElement;
  function set(v) { if (root.getAttribute('data-input') !== v) root.setAttribute('data-input', v); }
  addEventListener('pointerdown', function () { set('pointer'); }, true);
  addEventListener('keydown', function (e) {
    if (e.key === 'Shift' || e.key === 'Control' || e.key === 'Alt' || e.key === 'Meta') return;
    set('key');
  }, true);
})();
</script></head><body><div id="root"></div><script type="module" src="../../../src/preview/bilageirinn-site/main.tsx"></script></body></html>
