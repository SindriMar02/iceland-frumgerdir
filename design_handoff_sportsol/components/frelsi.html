<!-- @dsCard group="Components" -->
<!doctype html>
<html lang="is"><head><meta charset="utf-8">
<link rel="stylesheet" href="../foundations/fonts.css">
<link rel="stylesheet" href="../foundations/tokens.css">
<style>
  body { padding: 5vw; display: grid; grid-template-columns: 1fr 1fr; gap: 3rem; align-items: center; }
  figure { margin: 0; position: relative; max-width: 24rem; justify-self: center; }
  .layer { position: absolute; inset: 0; border-radius: 1.6rem; }
  .card { position: relative; border-radius: 1.6rem; padding: 1.75rem; background: linear-gradient(140deg, #C42979, #C74B28); box-shadow: 0 34px 70px -30px rgba(196,41,121,0.6); color: #fff; }
  .card .lbl { font-size: 0.9rem; letter-spacing: 0.2em; text-transform: uppercase; font-family: var(--font-bold); font-weight: 700; }
  .card .amt { font-family: var(--font-display); font-weight: 800; font-size: 2.6rem; margin: 2rem 0 0; }
  .card .pay { margin: 0.2rem 0 0; font-family: var(--font-med); font-weight: 500; }
  .card .foot { margin-top: 2rem; font-size: 0.75rem; letter-spacing: 0.03em; font-family: var(--font-bold); font-weight: 700; }
  h2 { font-family: var(--font-display); font-weight: 800; font-size: 2rem; line-height: 1.06; color: var(--ink); margin: 0; }
  h2 span { color: var(--pink); }
  ul { list-style: none; padding: 0; margin: 1.4rem 0 0; }
  li { display: flex; gap: 0.7rem; align-items: flex-start; font-size: 0.95rem; color: var(--body); margin-bottom: 0.7rem; }
  .check { flex-shrink: 0; margin-top: 0.15rem; width: 1.25rem; height: 1.25rem; border-radius: 50%; background: var(--pink-deep); color: #fff; display: grid; place-items: center; font-size: 0.65rem; }
  .btn { display: inline-flex; margin-top: 1.6rem; background: var(--pink-deep); color: #fff; border-radius: 999px; padding: 0.85rem 1.5rem; font-family: var(--font-bold); font-weight: 700; }
</style></head>
<body>
  <figure>
    <div class="layer" style="background:linear-gradient(140deg,#FFB53C55,#FF775255);transform:translate(1rem,1.25rem) rotate(3deg)"></div>
    <div class="layer" style="background:linear-gradient(140deg,#FFB53C88,#FF775288);transform:translate(0.5rem,0.625rem) rotate(1deg)"></div>
    <div class="card">
      <p class="lbl">Frelsi</p>
      <p class="amt">12.500 kr.</p>
      <p class="pay">inneign fyrir 10.000 kr.</p>
      <p class="foot">SPORTSÓL · HAMRABORG OG HVERAFOLD</p>
    </div>
  </figure>
  <div>
    <h2>Frelsi: inneign sem <span>rennur aldrei út</span></h2>
    <ul>
      <li><span class="check">✓</span>12.500 kr. inneign fyrir 10.000 kr., tuttugu prósenta afsláttur af tímagjaldi</li>
      <li><span class="check">✓</span>Inneignin rennur aldrei út</li>
      <li><span class="check">✓</span>Gildir í báðum stofum og í alla bekki</li>
      <li><span class="check">✓</span>Má nota með helgartilboði og morguntilboði</li>
    </ul>
    <a class="btn" href="#">Kaupa Frelsi</a>
  </div>
</body></html>
