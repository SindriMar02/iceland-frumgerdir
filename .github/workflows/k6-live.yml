name: K6 live (k6veitingar, rub23, bautinn, pizzasmidjan)

# Rebuilds and deploys the four K6 sites when Margrét publishes in the K6 studio (k6-veitingar.sanity.studio).
# Same pattern as reynir-live.yml: Sanity webhook (_tools/cms-publish-webhook.sh 3gt1u1vu sanity-publish-k6) →
# repository_dispatch here → build → gate → wrangler pages deploy, with this repo's CLOUDFLARE_API_TOKEN.
# The K6 code is its own private repo (SindriMar02/k6veitingar), read with a read-only deploy key
# (secret K6VEITINGAR_DEPLOY_KEY). A full build of all four takes seconds, so every publish rebuilds all four.
# The nightly run deploys only if a host's content stamp differs (notices and closures start and end by date,
# the Christmas season flips, a new good Google review arrives).
#
# TARGET: until go-live the four sites are the noindexed review hosts (k6veitingar-preview etc., deploy-preview.sh).
# On switch day (_docs/K6-GOLIVE-2026-10-18.md part D, after the custom domains are attached) set TARGET: live:
# deploy-live.sh builds the indexable live sites, runs gate --release, and deploys to the production branch of the
# four live projects (k6veitingar, rub23, bautinn, pizzasmidjan); the stamp checks then read the real domains.
on:
  repository_dispatch:
    types: [sanity-publish-k6]
  workflow_dispatch:
    inputs:
      check_only:
        description: 'Only read the four hosts and compare stamps; deploy nothing unless the content differs (like the nightly run)'
        type: boolean
        default: false
  schedule:
    - cron: '7 0 * * *'

permissions:
  contents: read

concurrency:
  group: k6-live
  cancel-in-progress: false

env:
  TARGET: live
  CLOUDFLARE_ACCOUNT_ID: 381fb216c6a65237476b5583061b3648

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: k6
    steps:
      - name: Target is known
        if: env.TARGET != 'preview' && env.TARGET != 'live'
        working-directory: .
        run: |
          echo "TARGET=$TARGET is neither preview nor live"
          exit 1
      - uses: actions/checkout@v4
        with:
          repository: SindriMar02/k6veitingar
          ssh-key: ${{ secrets.K6VEITINGAR_DEPLOY_KEY }}
          path: k6
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: k6/package-lock.json
      - run: npm ci
      - name: Google reviews (Business Profile API; keeps the committed selection when the secrets are absent or Google fails)
        run: node _tools/reviews-pull.mjs
        env:
          GBP_CLIENT_ID: ${{ secrets.GBP_CLIENT_ID }}
          GBP_CLIENT_SECRET: ${{ secrets.GBP_CLIENT_SECRET }}
          GBP_REFRESH_TOKEN: ${{ secrets.GBP_REFRESH_TOKEN }}
      - name: Published CMS content (fails if Sanity cannot be read or the content would break a site)
        run: node _tools/cms-pull.mjs
      - name: The four hosts this target serves
        run: |
          if [ "$TARGET" = live ]; then H="https://k6veitingar.is https://rub23.is https://bautinn.is https://pizzasmidjan.is"
          else H="https://k6veitingar-preview.pages.dev https://rub23-preview.pages.dev https://bautinn-preview.pages.dev https://pizzasmidjan-preview.pages.dev"; fi
          echo "HOSTS=$H" >> "$GITHUB_ENV"
      - name: Anything to deploy?
        id: check
        run: |
          STAMP=$(cat src/content/cms/stamp.txt)
          GO=0
          [ "${{ github.event_name }}" != "schedule" ] && [ "${{ inputs.check_only }}" != "true" ] && GO=1
          for h in $HOSTS; do
            LIVE=$(curl -sf "$h/cms-stamp.txt?$(date +%s)" || echo none)
            echo "$h: live $LIVE, content $STAMP"
            [ "$LIVE" = "$STAMP" ] || GO=1
          done
          [ "$GO" = 1 ] && echo "go=1" >> "$GITHUB_OUTPUT" || echo "all four hosts already carry this content"
      - if: steps.check.outputs.go == '1'
        name: Typecheck
        run: npx tsc -b
      - if: steps.check.outputs.go == '1' && env.TARGET == 'preview'
        name: Build, gate and deploy the four review sites
        run: K6_SKIP_PULL=1 bash _tools/deploy-preview.sh
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      - if: steps.check.outputs.go == '1' && env.TARGET == 'live'
        name: Build, gate --release and deploy the four live sites (production branch)
        run: K6_SKIP_PULL=1 K6_LIVE_BRANCH=main bash _tools/deploy-live.sh
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      - if: steps.check.outputs.go == '1'
        name: The four hosts serve this content
        run: |
          STAMP=$(cat src/content/cms/stamp.txt)
          for h in $HOSTS; do
            for i in 1 2 3 4 5 6; do
              LIVE=$(curl -sf "$h/cms-stamp.txt?$(date +%s)" || true)
              [ "$LIVE" = "$STAMP" ] && break
              sleep 10
            done
            [ "$LIVE" = "$STAMP" ] || { echo "$h serves $LIVE, expected $STAMP"; exit 1; }
            echo "$h: $STAMP"
          done
