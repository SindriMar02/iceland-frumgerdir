name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Queue deployments instead of cancelling in-flight ones. Cancelling a run
# mid-deploy (e.g. while it's polling the Pages API for status) can leave
# that deployment half-finished and cause the NEXT deploy to fail too with
# "Deployment failed, try again later" — queueing avoids that entirely.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      # Refresh Nýpugarðar prices from Godo before building. Never fails the
      # build: without secrets, or if Godo is down, the committed prices.json
      # from the last successful run ships instead.
      - run: node tools/nypugardar-prices.mjs
        env:
          GODO_API_KEY: ${{ secrets.GODO_API_KEY }}
          GODO_PROP_KEY: ${{ secrets.GODO_PROP_KEY }}
      - run: npm run build
        env:
          BASE_PATH: /iceland-frumgerdir/
          # Read-only Sanity viewer tokens, one per client CMS project. Without
          # these the production build never enters preview mode even inside
          # a studio's Presentation iframe (see isPreview in each preview's
          # sanity.ts), so the live-preview handshake silently never connects.
          VITE_SANITY_VIEWER_TOKEN: ${{ secrets.VITE_SANITY_VIEWER_TOKEN }}
          VITE_REYNIR_SANITY_VIEWER_TOKEN: ${{ secrets.VITE_REYNIR_SANITY_VIEWER_TOKEN }}
          # Where the click-to-edit overlays link back to. Not a secret. Without
          # it the build falls back to a localhost studio address, so an owner
          # clicking an element inside Presentation is sent to a studio that
          # only exists on the developer's machine.
          VITE_REYNIR_SANITY_STUDIO_URL: https://reynir-bakari.sanity.studio
      # Gate the artifact on the favicon check. This site is a GitHub Pages
      # *project* site sharing an origin with the ARTIX site at the root, so a
      # page without a usable icon shows a defence contractor's helm in a
      # prospective client's tab. Checks the BUILT output, which is what ships.
      # Rules and incident history: tools/favicon-guard.mjs
      - name: favicon-guard (blocks the deploy if any page lacks a usable icon)
        run: node tools/favicon-guard.mjs dist --base=/iceland-frumgerdir/

      # A deploy replaces dist/ wholesale, so a route missing from the postbuild
      # list stops existing rather than going stale, and the SPA serves NotFound.
      # That is how five deployed previews silently went 404 in July when a
      # deploy ran from a branch whose route list never had them. Blocks the
      # artifact if a route recorded as live disappears.
      - name: route-guard (blocks the deploy if a published route would 404)
        run: node tools/route-guard.mjs dist

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url || steps.deployment_retry.outputs.page_url || steps.deployment_retry2.outputs.page_url }}
    steps:
      # The Pages deployment API occasionally hard-fails a clean, uncontested
      # deployment on its very first status check ("Deployment failed, try
      # again later") with no useful detail — a genuine backend flake, not
      # something caused by our workflow. actions/deploy-pages doesn't retry
      # a hard failure itself, so retry it here automatically instead of
      # requiring a human to push another commit. Only the last attempt is
      # allowed to actually fail the job.
      - id: deployment
        uses: actions/deploy-pages@v4
        continue-on-error: true

      - name: Wait before retry
        if: steps.deployment.outcome == 'failure'
        run: sleep 20

      - id: deployment_retry
        name: Retry deploy (transient Pages API failure)
        if: steps.deployment.outcome == 'failure'
        uses: actions/deploy-pages@v4
        continue-on-error: true

      - name: Wait before final retry
        if: steps.deployment.outcome == 'failure' && steps.deployment_retry.outcome == 'failure'
        run: sleep 40

      - id: deployment_retry2
        name: Final retry (second transient failure)
        if: steps.deployment.outcome == 'failure' && steps.deployment_retry.outcome == 'failure'
        uses: actions/deploy-pages@v4
